  <title>AutoShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Primary - Light Blue
            primary: {
              50: "#EEF2FF",
              100: "#E0E7FF",
              200: "#C7D2FE",
              300: "#A5B4FC",
              400: "#818CF8",
              500: "#2216a8",
              600: "#1d128e",
              700: "#170e74",
              800: "#1e1b4b",
              900: "#312e81",
              950: "#1e1b4b",
              DEFAULT: "#2216a8",
            },
            // Dark - Black/Gray (from IMAS logo)
            dark: {
              50: "#F9FAFB",
              100: "#F3F4F6",
              200: "#E5E7EB",
              300: "#D1D5DB",
              400: "#9CA3AF",
              500: "#6B7280",
              600: "#4B5563",
              700: "#374151",
              800: "#1F2937",
              900: "#111827",
              950: "#030712",
              DEFAULT: "#111827",
            },
            // Button colors
            btn: {
              primary: "#2216a8",
              "primary-hover": "#1d128e",
              secondary: "#111827",
              "secondary-hover": "#1F2937",
              danger: "#EF4444",
              "danger-hover": "#DC2626",
              success: "#22C55E",
              "success-hover": "#16A34A",
            },
            // Status colors
            status: {
              success: "#22C55E",
              warning: "#F59E0B",
              error: "#EF4444",
              info: "#2216a8",
            },
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
          },
          boxShadow: {
            glow: "0 0 20px rgba(34, 22, 168, 0.3)",
            "glow-sm": "0 0 10px rgba(34, 22, 168, 0.2)",
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    /* Print styles for receipt */
    @media print {
      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      body {
        background: white;
      }
    }

    .print-only {
      display: none;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
